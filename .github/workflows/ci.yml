name: CI
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Architecture, syntax, brand and asset guards
        run: npm run lint
      - name: ESLint strict + complexity ratchet
        run: npm run lint:js
      - name: Prettier (format:check)
        run: npm run format:check
      - name: Typecheck (tsc --checkJs on @ts-check files)
        run: npm run typecheck
      - name: Unit tests (node --test)
        run: npm test
      - name: Smoke (all pages + 18 dashboard routes, jsdom)
        run: npm run test:smoke
      - name: Database tests (migrations 0001→0005, RPCs, RLS, fresh-store seed on PostgreSQL 16 / PGlite)
        run: npm run test:db
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end (Playwright, local demo mode)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - name: Secret scan (service_role / JWT literals must never be committed)
        run: |
          ! grep -rnE "eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}" --include=*.js --include=*.mjs --include=*.ts --include=*.json --include=*.html --exclude-dir=node_modules . || (echo "JWT-looking literal found" && exit 1)
          ! grep -rn "service_role" assets/ --include=*.js || (echo "service_role must never appear in client code" && exit 1)
  sbom:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate CycloneDX SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm --output-format JSON --output-file sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
      - name: npm audit (fails on high/critical)
        run: npm audit --audit-level=high
