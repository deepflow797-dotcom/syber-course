name: Release template → update all clients
# Push mode: tag the template (git tag v1.8.0 && git push --tags) → full gate → GitHub release → every store listed in
# clients.json is cloned, updated with scripts/update-from-template.mjs, checked and pushed (its CDN redeploys).
# One secret, once, in THIS repo: CLIENTS_TOKEN = fine-grained PAT with Contents: read/write (+ Issues: write) on the
# client repositories. Nothing per client.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --title "${GITHUB_REF_NAME}" || echo "release exists"
  clients:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          path: template
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: cd template && npm ci --no-audit --no-fund
      - name: Update every client in clients.json
        env:
          CLIENTS_TOKEN: ${{ secrets.CLIENTS_TOKEN }}
        run: |
          test -n "$CLIENTS_TOKEN" || { echo "::warning::CLIENTS_TOKEN not set — clients will update themselves via their own template-update workflow"; exit 0; }
          test -f template/clients.json || { echo "no clients.json — nothing to push"; exit 0; }
          git config --global user.name "store-bot"
          git config --global user.email "store-bot@users.noreply.github.com"
          for repo in $(node -e 'console.log(JSON.parse(require("fs").readFileSync("template/clients.json","utf8")).clients.map(c=>c.repo).join(" "))'); do
            echo "::group::$repo"
            rm -rf client && git clone --depth 1 "https://x-access-token:${CLIENTS_TOKEN}@github.com/${repo}.git" client
            ( cd client && node scripts/update-from-template.mjs --from ../template > ../out.txt 2>&1; code=$?; cat ../out.txt; exit $code ) && updated=$(grep -c '^updated=true' out.txt || true) || { echo "::error::$repo failed the gate — not pushed"; echo "::endgroup::"; continue; }
            if [ "$updated" = "1" ]; then
              version=$(grep '^version=' out.txt | tail -1 | cut -d= -f2)
              ( cd client && git add -A && git commit -m "template → ${version}" && git push )
              mig=$(grep '^migrations=' out.txt | tail -1 | cut -d= -f2-)
              if [ -n "$mig" ]; then GH_TOKEN="$CLIENTS_TOKEN" gh issue create -R "$repo" --title "Run database migrations for template ${version}" --body "New SQL files to run once in Supabase → SQL Editor: ${mig}"; fi
            fi
            echo "::endgroup::"
          done
