name: Keep Supabase awake
on:
  schedule:
    - cron: "17 6 */3 * *" # every 3 days (free projects pause after 7 idle days)
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: node scripts/keepalive.mjs # reads the public URL/key from assets/js/config.js — no secrets
